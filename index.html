<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="UK retirement and early-retirement Monte Carlo planner. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>UK Retirement Planner</title>
    <style>
      :root {
        --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f3f7; --text: #1f2933; --muted: #52606d;
        --border: #d3d9e0; --accent: #1d4ed8; --accent-text: #ffffff; --focus: #f59e0b;
        --danger: #b42318; --danger-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fff4d6; --ok: #166534; --ok-bg: #e7f6ec;
        --info-bg: #e8f0fe; --grid: rgba(0,0,0,0.08); --band-outer: rgba(29,78,216,0.14); --band-inner: rgba(29,78,216,0.30);
        --radius: 8px; --gap: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text); background: var(--bg); line-height: 1.45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1419; --surface: #182029; --surface-2: #1f2933; --text: #e4e7eb; --muted: #9aa5b1;
          --border: #334150; --accent: #7aa2ff; --accent-text: #0b1220; --focus: #fbbf24;
          --danger: #ff8a80; --danger-bg: #3b1d1b; --warn: #ffd27a; --warn-bg: #3a2e12; --ok: #7ee2a8; --ok-bg: #14301f;
          --info-bg: #1b2a44; --grid: rgba(255,255,255,0.10); --band-outer: rgba(122,162,255,0.16); --band-inner: rgba(122,162,255,0.34);
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      #app { max-width: 1360px; margin: 0 auto; padding: 0 16px 3rem; }
      a { color: var(--accent); }
      h1 { font-size: 1.4rem; margin: 0; }
      h2 { font-size: 1.3rem; margin: 0 0 .5rem; }
      h3 { font-size: 1.08rem; margin: 0 0 .5rem; }
      h4 { font-size: 1rem; margin: 0; }
      .muted { color: var(--muted); }
      .small { font-size: .85rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .skip-link { position: absolute; left: -999px; } .skip-link:focus { left: 1rem; top: 1rem; background: var(--surface); padding: .5rem; z-index: 10; }

      .app-header { display: flex; flex-wrap: wrap; gap: var(--gap); justify-content: space-between; align-items: center; padding: 1rem 0 .75rem; }
      .brand p { margin: .2rem 0 0; }
      .header-actions, .example-menu, .row-btns, .adders { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
      .tabs { display: flex; gap: .25rem; border-bottom: 2px solid var(--border); margin-bottom: 1rem; overflow-x: auto; scrollbar-width: thin; }
      .tab { padding: .55rem .85rem; text-decoration: none; color: var(--text); border-radius: var(--radius) var(--radius) 0 0; border: 1px solid transparent; border-bottom: none; white-space: nowrap; flex: none; }
      .tab[data-tab="results"] { margin-left: auto; font-weight: 600; color: var(--accent); }

      /* Inputs on the left, a live results summary on the right (stacks on narrow screens). */
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
      .layout.no-summary { grid-template-columns: minmax(0, 1fr); }
      .mortgage-payment { margin: .25rem 0 0; padding: .6rem .8rem; background: var(--info-bg); border-radius: var(--radius); }
      .alloc-presets { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .5rem; }
      .alloc-presets .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .layout.no-summary .summary { display: none; }
      .summary { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: .75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
      .sum-success { display: flex; flex-direction: column; gap: .1rem; text-decoration: none; color: var(--text); padding: .6rem .8rem; border-radius: 6px; background: var(--surface-2); }
      .sum-label { font-size: .85rem; color: var(--muted); }
      .sum-big { font-size: 2.1rem; font-weight: 700; line-height: 1.15; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
      .sum-stats { margin: 0; display: grid; gap: .5rem; }
      .sum-stats div { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
      .sum-stats dt { font-size: .85rem; color: var(--muted); }
      .sum-stats dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
      .sum-problems { color: var(--danger); font-weight: 600; }
      .sum-note { margin: 0; }
      .sum-cta { justify-content: center; }
      .summary .progress-wrap { margin: 0; flex-wrap: wrap; } .summary progress { flex: 1; width: auto; }
      .progress-wrap label { display: inline-flex; align-items: center; gap: .35rem; }
      .progress-slot .progress-wrap { margin: 0 0 var(--gap); padding: .5rem .75rem; background: var(--info-bg); border-radius: var(--radius); flex-wrap: wrap; }
      .progress-slot .progress-wrap[hidden] { display: none; }
      .spinner { display: inline-block; width: .9em; height: .9em; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .delta { font-size: .8rem; font-weight: 600; padding: .05rem .4rem; border-radius: 999px; white-space: nowrap; }
      .delta.up { color: var(--ok); background: var(--ok-bg); } .delta.down { color: var(--danger); background: var(--danger-bg); }
      @media (max-width: 1000px) {
        .layout { grid-template-columns: minmax(0, 1fr); }
        .summary { order: -1; top: 0; z-index: 5; flex-direction: row; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .5rem .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .sum-success { flex-direction: row; align-items: baseline; gap: .5rem; padding: .25rem .5rem; flex-wrap: wrap; }
        .sum-big { font-size: 1.3rem; }
        .sum-label, .sum-stats, .sum-note { display: none; }
        .sum-cta { margin-left: auto; padding: .3rem .7rem; font-size: .85rem; }
      }
      .tab:hover { background: var(--surface-2); }
      .tab[aria-current="page"] { background: var(--surface); border-color: var(--border); font-weight: 600; box-shadow: inset 0 3px 0 var(--accent); }
      .statusbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; min-height: 2.4rem; margin-bottom: .5rem; position: sticky; top: 0; background: var(--bg); z-index: 5; padding: .25rem 0; }
      .pill { display: inline-block; padding: .2rem .6rem; border-radius: 999px; text-decoration: none; font-weight: 600; border: 1px solid var(--border); background: var(--surface); }
      .progress-wrap { display: flex; gap: .5rem; align-items: center; margin-left: auto; }
      progress { width: 180px; height: 1rem; accent-color: var(--accent); }

      .btn { font: inherit; font-size: .92rem; padding: .45rem .85rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: .3rem; text-decoration: none; }
      .btn:hover { background: var(--surface-2); }
      .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
      .btn.ghost { background: transparent; }
      .btn.small { padding: .25rem .6rem; font-size: .85rem; }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .icon-btn, .help-btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; width: 1.6rem; height: 1.6rem; cursor: pointer; padding: 0; line-height: 1; }
      .confirm-wrap { display: inline-flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
      .confirm-q { font-weight: 600; }

      .panel-section, .card, .banner, .chart { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: var(--gap); }
      .card { background: var(--surface-2); }
      .panel-section > .card { background: var(--surface-2); }
      .card-head, .section-head, .results-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem 1rem; }
      .grid .full, fieldset.full { grid-column: 1 / -1; }
      fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; margin: 0; }
      fieldset.allocation .alloc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .5rem 1rem; margin-top: .5rem; }
      .alloc-custom > summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
      .alloc-custom[open] > summary { color: var(--text); }
      legend { font-weight: 600; padding: 0 .3rem; }

      .field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
      .field-head { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; }
      .field label { font-weight: 500; font-size: .92rem; }
      .unit { color: var(--muted); font-weight: 400; }
      .field.check label { display: flex; gap: .4rem; align-items: center; font-weight: 500; }
      input.money, input[type="number"] { font-variant-numeric: tabular-nums; }
      input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .5rem; width: 100%; min-width: 0; }
      input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
      input:disabled, select:disabled { opacity: .7; }
      [aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; }
      .help { margin: 0; font-size: .85rem; color: var(--muted); }
      .error { margin: 0; color: var(--danger); font-size: .85rem; }
      .error:empty { display: none; }
      .warning { color: var(--warn); background: var(--warn-bg); padding: .4rem .6rem; border-radius: 6px; }
      .warning:empty, [hidden] { display: none !important; }
      .ok { color: var(--ok); }
      .field-extras { display: inline-flex; gap: .3rem; align-items: center; font-size: .8rem; margin-left: auto; }
      .source-note { white-space: nowrap; }
      .modified-dot { color: var(--accent); }
      .verified { color: var(--muted); }
      .notice { background: var(--info-bg); padding: .5rem .75rem; border-radius: 6px; }
      .notice-bar { display: flex; gap: .75rem; align-items: center; padding: .5rem .75rem; border-radius: var(--radius); margin-bottom: .5rem; border: 1px solid var(--border); }
      .notice-bar p { margin: 0; flex: 1; }
      .notice-bar.info { background: var(--info-bg); } .notice-bar.warning { background: var(--warn-bg); } .notice-bar.error { background: var(--danger-bg); }
      .banner.info { background: var(--info-bg); }
      .error-list { color: var(--danger); } .warning-list li { margin-bottom: .25rem; }
      .summary li { margin-bottom: .35rem; }
      .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--gap); }
      .section-nav { display: flex; flex-wrap: wrap; gap: .25rem .75rem; margin: .5rem 0; font-size: .9rem; }
      .config-section .grid + div > h4, .config-section > div > h4 { margin: 1.25rem 0 .25rem; }
      .year-picker { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin-bottom: 1rem; }
      .year-picker .field { width: 220px; }

      ol.order { padding-left: 1.5rem; } ol.order li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .35rem .5rem; border-bottom: 1px solid var(--border); max-width: 520px; }
      .order-btns { display: inline-flex; gap: .25rem; }

      .table-wrap { overflow-x: auto; max-width: 100%; }
      .table-wrap.tall { max-height: 480px; overflow-y: auto; }
      table { border-collapse: collapse; width: 100%; font-size: .88rem; }
      th, td { padding: .35rem .5rem; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; vertical-align: top; }
      th:first-child, td:first-child { text-align: left; }
      thead th { position: sticky; top: 0; background: var(--surface); }
      .sticky-first tbody th, .sticky-first thead th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
      .sticky-first thead th:first-child { z-index: 2; }
      td { font-variant-numeric: tabular-nums; }
      .editor-table td, .editor-table th { text-align: left; white-space: normal; }
      .editor-table .field label { font-size: .8rem; }
      .matrix input { width: 5.5rem; }
      .matrix .diag { color: var(--muted); text-align: center; }

      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
      .stat .big, .headline .big { font-size: 2rem; font-weight: 700; margin: .25rem 0; display: block; }
      .success.robust, .pill.robust { border-left: 6px solid var(--ok); } .success.robust .band-label { color: var(--ok); }
      .success.borderline, .pill.borderline { border-left: 6px solid var(--warn); } .success.borderline .band-label { color: var(--warn); }
      .success.at-risk, .pill.at-risk { border-left: 6px solid var(--danger); } .success.at-risk .band-label { color: var(--danger); }
      .error-pill { border-left: 6px solid var(--danger); }
      .headline .success { padding: .75rem 1rem; border-radius: var(--radius); background: var(--surface-2); }
      .band-label { display: block; font-weight: 700; }
      .chart figcaption { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
      .chart-box { position: relative; height: 320px; }
      .chart.placeholder .chart-box { background: var(--surface-2); border-radius: 6px; }
      .chart p { margin: .5rem 0 0; }
      figure { margin: 0 0 var(--gap); }
      .results.stale .stats, .results.stale .chart { opacity: .75; }
      .toggle { display: inline-flex; align-items: center; gap: .3rem; }

      .app-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
      .disclaimer { color: var(--danger); }
      .toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 20; }
      .toast { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--accent); padding: .6rem .9rem; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.15); max-width: 360px; }
      .toast.error { border-left-color: var(--danger); }
      @media (max-width: 640px) {
        .progress-wrap { margin-left: 0; width: 100%; } progress { flex: 1; }
        .chart-box { height: 260px; }
        .stat .big, .headline .big { font-size: 1.6rem; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

      /* Plain-English verdict: big figure on the left, what it means on the right. */
      .verdict { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; padding: 1rem 1.25rem; border-radius: var(--radius); background: var(--surface-2); }
      .verdict-figure { display: flex; flex-direction: column; flex: 0 1 17rem; }
      .verdict-figure .big { font-size: 2.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .verdict-text { flex: 1; min-width: 16rem; }
      .verdict-text p { margin: 0 0 .35rem; }
      .verdict-lead { font-size: 1.15rem; font-weight: 600; }
      .verdict-text { border-left: 1px solid var(--border); padding-left: 1.25rem; }
      @media (max-width: 640px) { .verdict-text { border-left: none; padding-left: 0; } }
      .key-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; margin: .75rem 0 0; }
      .key-facts .fact { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .8rem; }
      .key-facts dt { font-size: .85rem; color: var(--muted); }
      .key-facts dd { margin: .15rem 0 0; display: flex; flex-direction: column; gap: .15rem; }
      .fact-value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .whatif-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
      @media (max-width: 760px) { .whatif-grid { grid-template-columns: minmax(0, 1fr); } }
      .whatif-row { display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; align-items: baseline; margin-bottom: 1rem; }
      .whatif-row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); min-height: 1.75rem; }
      .whatif-value { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
      .whatif-out { background: var(--surface-2); border-radius: var(--radius); padding: .9rem 1rem; }
      .whatif-out p { margin: .5rem 0 0; }
      .whatif-spend { margin-top: .75rem; padding: .75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); }
      .whatif-spend p { margin: 0; }
      .whatif-spend p + p { margin-top: .4rem; }
      .whatif-spend .btn { margin-left: .25rem; }
      .whatif-figure { display: flex; flex-wrap: wrap; gap: .25rem .6rem; align-items: baseline; padding-left: .75rem; }
      .whatif-figure .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .scenario-list { margin: 0; padding-left: 1.25rem; } .scenario-list li { margin-bottom: .4rem; }
      .grid .field.wide { grid-column: span 2; }
      @media (max-width: 560px) { .grid .field.wide { grid-column: auto; } }
      .step-nav { display: flex; justify-content: space-between; gap: .5rem; margin-top: var(--gap); }
      .fan-legend { display: inline-flex; gap: .9rem; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
      .fan-legend span { display: inline-flex; align-items: center; gap: .35rem; }
      .sw { display: inline-block; width: 1.1rem; height: .7rem; border-radius: 2px; }
      .sw.outer { background: var(--band-outer); } .sw.inner { background: var(--band-inner); }
      .sw.median { height: 3px; background: var(--accent); }
      details.config-section > summary, details.quick-start > summary, details.advanced > summary { display: flex; align-items: center; gap: .75rem; cursor: pointer; list-style: none; }
      details.config-section > summary::-webkit-details-marker, details.quick-start > summary::-webkit-details-marker, details.advanced > summary::-webkit-details-marker { display: none; }
      details.config-section > summary::before, details.quick-start > summary::before, details.advanced > summary::before { content: '▸'; color: var(--muted); width: 1em; }
      details.config-section[open] > summary::before, details.quick-start[open] > summary::before, details.advanced[open] > summary::before { content: '▾'; }
      details.config-section > summary h3, details.quick-start > summary h3, details.advanced > summary h3 { margin: 0; }
      details.quick-start[open] > summary, details.advanced[open] > summary { margin-bottom: .5rem; }
      details.quick-start { border-color: var(--accent); }
      .quick-group { border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem 1rem 1rem; margin: 0 0 1rem; }
      .quick-group > legend { font-weight: 600; padding: 0 .35rem; }
      .seg { display: inline-flex; }
      .seg .btn { border-radius: 0; }
      .seg .btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
      .seg .btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-left: -1px; }
      .seg .btn[aria-checked="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      .quick-more { margin: 0 0 1rem; }
      .quick-more > summary { cursor: pointer; font-weight: 600; margin-bottom: .75rem; }
      .tax-year-note { margin: .25rem 0 0; }
      .jump-links { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin: -.25rem 0 1rem; font-size: .95rem; }
      #summary, #whatif, #charts, #year-by-year, #quickstart, #simulation { scroll-margin-top: 1rem; }
      details.config-section:not([open]) { padding-bottom: 1rem; }
      details.config-section[open] > summary { margin-bottom: .5rem; }
      .changed-count { color: var(--accent); font-size: .85rem; } .problem-count { color: var(--danger); font-size: .85rem; font-weight: 600; }
      @media (max-width: 640px) {
        .brand p { display: none; }
        .app-header { padding: .6rem 0 .4rem; gap: .5rem; }
        .header-actions .btn { padding: .3rem .6rem; font-size: .85rem; }
        /* Fade the right edge so it is obvious the tab strip scrolls. */
        .tabs { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
        .verdict-figure .big { font-size: 2rem; }
        .step-nav .btn { font-size: .85rem; }
      }
    </style>
  </head>
  <body>
    <noscript><p style="padding:1rem">This planner needs JavaScript. It runs entirely in your browser; nothing is uploaded.</p></noscript>
    <div id="app"><p style="padding:1rem">Loading…</p></div>
    <footer class="sr-only">This is a modelling tool, not financial advice.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
